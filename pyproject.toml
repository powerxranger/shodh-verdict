[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.1.0"
description = "Evidence-backed AI-assisted review of specifications, decision workflows and linked code"
requires-python = ">=3.10"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
verdict = "verdict.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
